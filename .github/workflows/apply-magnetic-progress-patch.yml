name: Apply magnetic progress patch

on:
  push:
    branches: [ fix/magnetic-progress-persistence ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ hashFiles('.ci/magnetic-progress.patch.gz.b64') != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/magnetic-progress-persistence
          fetch-depth: 0

      - name: Decode and apply patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .ci/magnetic-progress.patch.gz.b64 | gzip -d > /tmp/magnetic-progress.patch
          git apply --3way /tmp/magnetic-progress.patch
          rm -f .ci/magnetic-progress.patch.gz.b64
          rm -f .github/workflows/apply-magnetic-progress-patch.yml

      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: persist magnetic rebuild progress"
          git push origin HEAD:fix/magnetic-progress-persistence
