name: Apply Magnetic Rebuild Patch

on:
  push:
    branches: [ feature/magnetic-rebuild ]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/magnetic-rebuild
          fetch-depth: 0

      - name: Decode and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat .ai/patches/magnetic.patch.gz.b64.* | base64 --decode > /tmp/magnetic.patch.gz
          echo '97b0a01277a23c31831fc021e31b275df482dbd26b49a9e3fc11fc446acafc89  /tmp/magnetic.patch.gz' | sha256sum --check
          gzip --decompress --stdout /tmp/magnetic.patch.gz > /tmp/magnetic.patch
          echo '750bdc7c2b84b029842909e8f1cd30a91d6097e88468d6f500d6046102bdc1f3  /tmp/magnetic.patch' | sha256sum --check

      - name: Apply source commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git am --3way /tmp/magnetic.patch

      - name: Remove one-time staging files
        shell: bash
        run: |
          set -euo pipefail
          git rm .ai/patches/magnetic.patch.gz.b64.* .github/workflows/apply-magnetic-patch.yml
          git commit -m 'chore: remove one-time magnetic patch staging [skip ci]'

      - name: Push real source commits
        run: git push origin HEAD:feature/magnetic-rebuild
